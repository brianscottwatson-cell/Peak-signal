name: Guardrails

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    name: Content rules, feature map, and SEO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Unit tests
        run: node --test scripts/guardrails.test.mjs scripts/seo.test.mjs

      - name: WWW redirect
        if: success() || failure()
        run: node --test scripts/www-apex-redirect.test.mjs

      - name: Feature map
        if: success() || failure()
        run: node scripts/check-feature-map.mjs

      - name: Content guardrail
        if: success() || failure()
        run: node scripts/check-guardrails.mjs

      - name: SEO consistency
        if: success() || failure()
        run: node scripts/check-seo.mjs

      - name: Tailwind file
        if: success() || failure()
        run: node scripts/check-tailwind.mjs

      - name: Public links
        if: success() || failure()
        run: node scripts/check-public-links.mjs

      - name: IndexNow key
        if: success() || failure()
        run: node --test scripts/indexnow.test.mjs

      - name: Install voice dependencies
        if: success() || failure()
        working-directory: voice/cht
        run: npm ci

      # Voice tests stub outbound calls. No credentials, and no route off
      # this machine, so a missed stub cannot write anywhere.
      - name: Voice tests
        if: success() || failure()
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GH_ENTERPRISE_TOKEN: ""
          GITHUB_ENTERPRISE_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
        run: bash scripts/run-voice-tests.sh
