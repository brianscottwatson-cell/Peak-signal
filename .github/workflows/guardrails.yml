name: Guardrails

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    name: Content rules and feature map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Unit tests
        run: node --test scripts/guardrails.test.mjs

      - name: Feature map
        if: success() || failure()
        run: node scripts/check-feature-map.mjs

      - name: Content guardrail
        if: success() || failure()
        run: node scripts/check-guardrails.mjs
