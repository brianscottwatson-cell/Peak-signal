<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Telecom requests — Peak Signal Ops</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0B0D0C; --panel:#121513; --line:#242a26; --text:#E8EBE9; --muted:#9AA39C; --accent:#3B82F6; --pass:#34D399; --warn:#FBBF24; }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,Helvetica,system-ui,sans-serif; }
    .wrap { max-width:880px; margin:0 auto; padding:20px 16px 48px; }
    h1 { font-size:18px; margin:0; font-weight:600; }
    .sub, .hint { color:var(--muted); font-size:12.5px; line-height:1.5; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
    .kicker { font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 8px; }
    label { display:grid; gap:6px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:10px; }
    input, textarea { width:100%; background:#171b18; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:13px Inter,Helvetica,sans-serif; }
    button, .btn { border:0; border-radius:10px; padding:11px 14px; font:600 13px Inter,Helvetica,sans-serif; background:var(--accent); color:#fff; cursor:pointer; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
    .danger { background:transparent; color:#fca5a5; border:1px solid #7f1d1d; }
    dl { display:grid; grid-template-columns:9rem 1fr; gap:4px 12px; margin:10px 0; }
    dt { color:var(--muted); font-size:12px; }
    dd { margin:0; font-size:14px; }
    .pill { display:inline-block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:999px; }
    .requested { background:rgba(59,130,246,.15); color:#93c5fd; }
    .approved { background:rgba(52,211,153,.12); color:var(--pass); }
    .declined { background:rgba(248,113,113,.12); color:#fca5a5; }
    .err { color:#f87171; font-size:12px; }
    a { color:var(--accent); }
    @media (max-width:640px) { dl { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Ops</p>
    <h1>Telecom requests</h1>
    <p class="sub">Internal Peak Signal view. Not shown to visitors. Approving records Brian's decision. It does not order service, email the visitor, or contact a vendor.</p>
    <p class="hint"><a href="/ops">All ops</a></p>

    <section class="card" id="gate">
      <p class="kicker">Owner login</p>
      <form id="login">
        <label>Password<input id="pw" type="password" required autocomplete="current-password" /></label>
        <div class="row"><button type="submit">Open ops</button></div>
        <p class="err" id="loginErr" hidden></p>
      </form>
    </section>

    <div id="app" hidden>
      <p class="hint" id="empty" hidden>No requests yet.</p>
      <div id="list"></div>
    </div>
  </div>
  <script>
    const gate = document.getElementById("gate");
    const app = document.getElementById("app");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const loginErr = document.getElementById("loginErr");

    async function api(path, opts) {
      const response = await fetch(path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        ...opts,
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || body.errors?.[0] || response.statusText);
      return body;
    }

    function showApp() {
      gate.hidden = true;
      app.hidden = false;
    }

    function row(label, value) {
      const dt = document.createElement("dt");
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.textContent = value || "";
      return [dt, dd];
    }

    function render(requests) {
      list.replaceChildren();
      empty.hidden = requests.length > 0;
      for (const item of requests) {
        const card = document.createElement("article");
        card.className = "card";
        const pill = document.createElement("span");
        pill.className = `pill ${item.status || "requested"}`;
        pill.textContent = item.status || "requested";
        const title = document.createElement("h2");
        title.textContent = `${item.company || ""} · ${item.kind || ""}`;
        const dl = document.createElement("dl");
        const pairs = [
          ["Request", item.id],
          ["Contact", [item.contactName, item.contactEmail, item.contactPhone].filter(Boolean).join(" · ")],
          ["Address", item.formatted],
          ["Need", item.bandwidth],
          ["Vendor", item.vendorName],
          ["Option", item.offering],
          ["Seats", item.seats],
          ["Current provider", item.currentProvider],
          ["Contract end", item.contractEnd],
          ["Locations", item.locations],
          ["Needs", item.needs],
          ["Services", item.services],
          ["Lines or seats", item.linesSeats],
          ["Timeline", item.timeline],
          ["Path", item.path],
          ["Speeds", item.desiredSpeeds],
          ["Fiber or broadband", item.accessType],
          ["Budget", item.budget == null ? "" : String(item.budget)],
          ["Follow-up", item.humanFollowUp ? "Human follow-up" : ""],
          ["Vendor results", item.returnedPricing && item.returnedPricing.text],
          ["Notes", item.notes],
          ["Pricing", item.pricing || "Brian will confirm pricing"],
          ["Note", item.decisionNote],
        ];
        for (const [label, value] of pairs) {
          if (!value) continue;
          for (const node of row(label, value)) dl.appendChild(node);
        }
        const note = document.createElement("textarea");
        note.rows = 2;
        note.placeholder = "Note for this request";
        const results = document.createElement("textarea");
        results.rows = 4;
        results.placeholder = "Paste vendor results";
        const actions = document.createElement("div");
        actions.className = "row";
        const approve = document.createElement("button");
        approve.type = "button";
        approve.textContent = "Approve";
        const decline = document.createElement("button");
        decline.type = "button";
        decline.className = "btn danger";
        decline.textContent = "Decline";
        const saveResults = document.createElement("button");
        saveResults.type = "button";
        saveResults.className = "btn ghost";
        saveResults.textContent = "Save vendor results";
        approve.addEventListener("click", () => decide(item.id, "approve", note.value));
        decline.addEventListener("click", () => decide(item.id, "decline", note.value));
        saveResults.addEventListener("click", () => decide(item.id, "attach-pricing", results.value));
        actions.append(approve, decline, saveResults);
        card.append(pill, title, dl, results, note, actions);
        list.appendChild(card);
      }
    }

    async function load() {
      const body = await api("/ops/api/telecom/requests");
      render(body.requests || []);
    }

    async function decide(id, action, note) {
      await api(`/ops/api/telecom/requests/${encodeURIComponent(id)}`, {
        method: "POST",
        body: JSON.stringify({ action, note }),
      });
      await load();
    }

    document.getElementById("login").addEventListener("submit", async (event) => {
      event.preventDefault();
      loginErr.hidden = true;
      try {
        await api("/ops/api/login", { method: "POST", body: JSON.stringify({ password: document.getElementById("pw").value }) });
        showApp();
        await load();
      } catch (err) {
        loginErr.textContent = "Wrong password.";
        loginErr.hidden = false;
      }
    });

    (async () => {
      try {
        const session = await api("/ops/api/session");
        if (session.authed) {
          showApp();
          await load();
        }
      } catch (err) { /* stay on the login gate */ }
    })();
  </script>
</body>
</html>
